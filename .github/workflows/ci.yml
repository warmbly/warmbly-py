name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check src tests
      - name: Ruff (format)
        run: ruff format --check src tests
      - name: mypy
        run: mypy src

  test:
    name: Test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # Trim the cross-OS matrix to the newest interpreters.
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[oauth,test]"
      # Coverage is gated by `fail_under` in pyproject.toml: pytest-cov exits
      # non-zero if total coverage drops below the threshold, so the build fails
      # on a coverage regression without any external service. The gateway
      # integration tests are skipped on Windows (the in-process websocket server
      # is flaky on the ProactorEventLoop), so coverage there is incomplete by
      # design; the 100% gate runs on Linux and macOS, which execute the full
      # suite, while Windows still runs every other test for correctness.
      - name: Run tests (with coverage gate)
        if: matrix.os != 'windows-latest'
        run: pytest --cov --cov-report=term-missing
      - name: Run tests (Windows, no coverage gate)
        if: matrix.os == 'windows-latest'
        run: pytest
